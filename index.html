<!DOCTYPE html>
<html lang="de" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Flashcard-AI</title>

    <!--
      Content Security Policy
      ───────────────────────
      Schützt vor XSS und Supply-Chain-Angriffen.
      Erlaubt ausschließlich die tatsächlich genutzten externen Quellen:
        • script-src  – Tailwind CDN, cdnjs (Cropper.js), Cloudflare Turnstile
        • style-src   – cdnjs (FontAwesome, Cropper.js) + 'unsafe-inline' für
                        Tailwinds JIT-Runtime (schreibt dynamisch <style>-Tags)
        • img-src     – data: (Base64-Vorschau), blob: (Cropper-Canvas-Export)
        • connect-src – /api/scan (Vercel Serverless), Cloudflare Turnstile-Verify
        • frame-src   – Cloudflare Turnstile (rendert in eigenem iframe)
        • object-src  – none (deaktiviert Flash/Plugin-Vektoren komplett)
        • base-uri    – self (verhindert Base-Tag-Hijacking)
    -->
    <meta http-equiv="Content-Security-Policy" content="
        default-src 'self';
        script-src  'self' 'unsafe-inline'
                    https://cdn.tailwindcss.com
                    https://cdnjs.cloudflare.com
                    https://challenges.cloudflare.com;
        style-src   'self' 'unsafe-inline'
                    https://cdnjs.cloudflare.com;
        font-src    'self' 
                    https://cdnjs.cloudflare.com;
        img-src     'self' data: blob:;
        connect-src 'self'
                    https://challenges.cloudflare.com;
        frame-src   https://challenges.cloudflare.com;
        object-src  'none';
        base-uri    'self';
        ">

    <link rel="icon" href="brain.png" type="image/png">
    
    <!-- PWA Meta Tags -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-touch-fullscreen" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <meta name="theme-color" content="#000000">

    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="brain.png">

    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">

    <!-- Cropper.js -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>

    <!-- Cloudflare Turnstile -->
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?onload=onTurnstileLoad" async defer></script>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            corePlugins: { preflight: true },
            theme: {
                extend: {
                    colors: {
                        slate: {
                            50: '#f8fafc', 100: '#f1f5f9', 200: '#e2e8f0',
                            300: '#cbd5e1', 400: '#94a3b8', 500: '#64748b',
                            600: '#475569', 700: '#334155', 800: '#1e293b',
                            850: '#172033', 900: '#000000', 950: '#020617'
                        }
                    }
                }
            }
        }
    </script>

    <style>
        /* ── CSS Custom Properties for theming ── */
        :root {
            --color-primary: #6366f1;
            --color-primary-hover: #4f46e5;
            --color-primary-light: rgba(99,102,241,0.15);
            --color-primary-shadow: rgba(99,102,241,0.35);
        }
        :root[data-accent="teal"] {
            --color-primary: #14b8a6;
            --color-primary-hover: #0d9488;
            --color-primary-light: rgba(20,184,166,0.15);
            --color-primary-shadow: rgba(20,184,166,0.35);
        }
        :root[data-accent="violet"] {
            --color-primary: #8b5cf6;
            --color-primary-hover: #7c3aed;
            --color-primary-light: rgba(139,92,246,0.15);
            --color-primary-shadow: rgba(139,92,246,0.35);
        }

        /* ── Base ── */
        body { -webkit-tap-highlight-color: transparent; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* ── Card flip ── */
        .perspective { perspective: 1000px; }
        .preserve-3d { transform-style: preserve-3d; }
        .backface-hidden { backface-visibility: hidden; }
        .rotate-y-180 { transform: rotateY(180deg); }
        .flip-transition { transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1); }

        /* ── Swipe animations ── */
        .swipe-left  { animation: swipeLeftOut  0.3s forwards; }
        .swipe-right { animation: swipeRightOut 0.3s forwards; }
        @keyframes swipeLeftOut  { to { transform: translateX(-100%) rotate(-10deg); opacity: 0; } }
        @keyframes swipeRightOut { to { transform: translateX(100%)  rotate(10deg);  opacity: 0; } }

        /* ── Accent-color utilities ── */
        .accent-bg     { background-color: var(--color-primary); }
        .accent-bg-hover:hover { background-color: var(--color-primary-hover); }
        .accent-text   { color: var(--color-primary); }
        .accent-border { border-color: var(--color-primary); }
        .accent-light  { background-color: var(--color-primary-light); }
        .accent-shadow { box-shadow: 0 8px 30px var(--color-primary-shadow); }
        .accent-ring:focus { outline: 2px solid var(--color-primary); outline-offset: 2px; }
        .nav-active    { color: var(--color-primary) !important; }

        /* ── Light/Dark surface colors ── */
        .bg-surface   { background-color: #f1f5f9; }
        .dark .bg-surface { background-color: #000000; }
        .bg-card      { background-color: #ffffff; }
        .dark .bg-card { background-color: #1e293b; }
        .border-subtle { border-color: #e2e8f0; }
        .dark .border-subtle { border-color: #334155; }
        .text-base    { color: #1e293b; }
        .dark .text-base { color: #e2e8f0; }
        .text-muted   { color: #64748b; }
        .dark .text-muted { color: #94a3b8; }

        /* ── Flashcard ── */
        #flashcard-wrapper {
            flex: 1 1 0%;
            min-height: 0;
            display: flex;
            flex-direction: column;
        }
        #flashcard-container {
            flex: 1 1 0%;
            min-height: 0;
            display: flex;
            align-items: stretch;
        }
        #flashcard-container > div {
            flex: 1 1 0%;
            min-height: 0;
        }
        #flashcard {
            width: 100%;
            height: 100%;
            min-height: 220px;
        }

        .deck-item { transition: transform 0.15s, box-shadow 0.15s; }
        .deck-item:active { transform: scale(0.98); }

        /* ── Modal overlay ── */
        .modal-overlay {
            position: fixed; inset: 0; z-index: 60;
            background: rgba(0,0,0,0.55);
            backdrop-filter: blur(4px);
            display: flex; align-items: flex-end; justify-content: center;
        }
        .modal-sheet {
            width: 100%; max-width: 480px;
            border-radius: 1.5rem 1.5rem 0 0;
            padding: 1.5rem 1.5rem 2.5rem;
            animation: slideUp 0.28s cubic-bezier(0.32,0.72,0,1);
        }
        .dark .modal-sheet { background: #1e293b; }
        .modal-sheet { background: #fff; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        @keyframes badgePop { from { transform: scale(0.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%       { transform: translateX(-6px); }
            40%       { transform: translateX(6px); }
            60%       { transform: translateX(-4px); }
            80%       { transform: translateX(4px); }
        }
        .animate-shake { animation: shake 0.5s ease; }

        /* ── Scan deck multiselect chips ── */
        .deck-chip {
            display: inline-flex; align-items: center; gap: 0.3rem;
            font-size: 0.7rem; font-weight: 700; line-height: 1;
            padding: 0.25rem 0.55rem;
            border-radius: 999px;
            background: var(--color-primary-light);
            color: var(--color-primary);
            border: 1.5px solid var(--color-primary);
            white-space: nowrap; max-width: 10rem; overflow: hidden; text-overflow: ellipsis;
        }
        .deck-option-row { display:flex; align-items:center; gap:0.75rem; padding:0.55rem 0.85rem; cursor:pointer; transition:background 0.12s; }
        .deck-option-row:hover { background: var(--color-primary-light); }
        .deck-option-row input[type=checkbox] { accent-color: var(--color-primary); width:1rem; height:1rem; flex-shrink:0; cursor:pointer; }

        .accent-dot {
            width: 1.4rem; height: 1.4rem;
            border-radius: 50%;
            cursor: pointer;
            border: 3px solid transparent;
            transition: transform 0.15s, border-color 0.15s;
        }
        .accent-dot:hover { transform: scale(1.1); }
        .accent-dot.selected { border-color: white; box-shadow: 0 0 0 2px var(--color-primary); }

        .back-btn { cursor: pointer; }

        .lang-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            width: 100%;
            max-width: 24rem;
            padding: 0.9rem 1.5rem;
            border-radius: 1rem;
            font-size: 1rem;
            font-weight: 600;
            border: 2px solid transparent;
            transition: transform 0.15s, background 0.15s, border-color 0.15s;
            cursor: pointer;
        }
        .lang-btn:active { transform: scale(0.97); }
        .lang-btn.lang-de { background: var(--color-primary-light); color: var(--color-primary); border-color: var(--color-primary); }
        .lang-btn.lang-en { background: transparent; color: #64748b; border-color: #cbd5e1; }
        .dark .lang-btn.lang-en { color: #94a3b8; border-color: #334155; }
        .lang-btn.lang-selected { background: var(--color-primary); color: #fff; border-color: var(--color-primary); }

        .lang-toggle-btn {
            display: flex; align-items: center; gap: 0.4rem;
            font-size: 0.8rem; font-weight: 600; padding: 0.3rem 0.75rem;
            border-radius: 0.6rem; border: 1.5px solid var(--color-primary);
            color: var(--color-primary); background: transparent;
            cursor: pointer; transition: background 0.15s;
        }
        .lang-toggle-btn:hover { background: var(--color-primary-light); }

        /* ── Learn-mode active button ── */
        .learn-mode-btn { transition: background 0.15s, color 0.15s, border-color 0.15s; }
        .learn-mode-btn.active {
            background-color: var(--color-primary) !important;
            color: #fff !important;
            border-color: var(--color-primary) !important;
        }

        /* ── PWA Install Banner ── */
        #install-banner {
            display: none;
            position: fixed;
            bottom: 0; left: 0; right: 0;
            z-index: 9999;
            padding: 1rem 1.25rem calc(1.25rem + env(safe-area-inset-bottom));
            background: #ffffff;
            border-top: 1px solid #e2e8f0;
            box-shadow: 0 -4px 24px rgba(0,0,0,0.10);
            animation: slideUpBanner 0.32s cubic-bezier(0.32,0.72,0,1);
        }
        .dark #install-banner {
            background: #1e293b;
            border-top-color: #334155;
            box-shadow: 0 -4px 24px rgba(0,0,0,0.35);
        }
        @keyframes slideUpBanner {
            from { transform: translateY(100%); opacity: 0; }
            to   { transform: translateY(0);    opacity: 1; }
        }
        #install-banner.visible { display: block; }

        #install-android-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            width: 100%;
            padding: 0.85rem 1.25rem;
            border-radius: 1rem;
            font-size: 1rem;
            font-weight: 700;
            color: #fff;
            background-color: var(--color-primary);
            box-shadow: 0 4px 18px var(--color-primary-shadow);
            cursor: pointer;
            border: none;
            transition: background 0.15s, transform 0.12s;
        }
        #install-android-btn:active { transform: scale(0.97); }

        #install-ios-hint {
            display: flex;
            align-items: flex-start;
            gap: 0.75rem;
            padding: 0.85rem 1rem;
            border-radius: 1rem;
            background: var(--color-primary-light);
            border: 1.5px solid var(--color-primary);
        }
        #install-ios-hint .ios-icons {
            display: flex;
            align-items: center;
            gap: 0.3rem;
            font-size: 1.2rem;
            color: var(--color-primary);
            flex-shrink: 0;
            margin-top: 0.05rem;
        }
        #install-ios-hint p {
            font-size: 0.875rem;
            font-weight: 500;
            line-height: 1.45;
            color: #1e293b;
        }
        .dark #install-ios-hint p { color: #e2e8f0; }

        #install-banner-close {
            position: absolute;
            top: 0.75rem; right: 1rem;
            font-size: 1.5rem;
            color: #ffffff;
            cursor: pointer;
            background: none;
            border: none;
            padding: 1.1rem;
            line-height: 1;
            transition: color 0.15s;
        }
        #install-banner-close:hover { color: var(--color-primary); }
    </style>
</head>

<body class="bg-surface text-base transition-colors duration-300 h-screen w-screen overflow-hidden flex flex-col font-sans relative">

    <input type="file" id="backup-input" class="hidden" accept=".json" onchange="importData(event)">

    <!-- ═══ HEADER ═══ -->
    <header id="main-header" class="hidden flex-shrink-0 flex justify-between items-center px-5 py-3 z-10 bg-surface border-b border-subtle">
        <div class="flex items-center gap-2">
            <button id="header-back-btn" class="back-btn hidden accent-text mr-1" onclick="handleBackBtn()">
                <i class="fa-solid fa-chevron-left text-lg"></i>
            </button>
            <h1 class="text-lg font-bold tracking-tight" id="header-title">Flashcard-AI</h1>
        </div>
        <div class="flex gap-3 items-center">
            <button onclick="triggerImport()" class="text-muted hover:accent-text transition" data-i18n-title="import_title">
                <i class="fa-solid fa-upload text-lg"></i>
            </button>
            <button onclick="downloadData()" class="text-muted hover:accent-text transition" data-i18n-title="export_title">
                <i class="fa-solid fa-download text-lg"></i>
            </button>
            <button onclick="openSettingsModal()" class="text-muted hover:accent-text transition" data-i18n-title="settings_title">
                <i class="fa-solid fa-sliders text-lg"></i>
            </button>
        </div>
    </header>

    <!-- ═══ MAIN ═══ -->
    <main class="flex-1 overflow-y-auto hide-scrollbar relative z-0" id="main-container">

        <!-- ─── View: Onboarding ─── -->
        <section id="view-onboarding" class="absolute inset-0 flex flex-col justify-center items-center p-8 bg-surface z-50 hidden">
            <div class="absolute top-4 right-5 flex gap-3 items-center">
                <div class="flex gap-2 items-center">
                    <button class="accent-dot" data-accent="indigo" style="background:#6366f1" onclick="setAccent('indigo')" title="Indigo"></button>
                    <button class="accent-dot" data-accent="teal"   style="background:#14b8a6" onclick="setAccent('teal')"   title="Teal"></button>
                    <button class="accent-dot" data-accent="violet" style="background:#8b5cf6" onclick="setAccent('violet')" title="Violet"></button>
                </div>
                <button onclick="toggleTheme()" class="text-muted hover:accent-text transition ml-1">
                    <i class="fa-solid fa-moon text-xl" id="theme-icon-onboarding"></i>
                </button>
            </div>

            <div class="w-20 h-20 accent-bg rounded-3xl flex items-center justify-center mb-6 accent-shadow">
                <i class="fa-solid fa-brain text-white text-4xl"></i>
            </div>

            <div class="flex gap-3 mb-7 w-full max-w-sm">
                <button id="lang-btn-de" class="lang-btn lang-de flex-1" onclick="setLanguage('de')">🇩🇪 Deutsch</button>
                <button id="lang-btn-en" class="lang-btn lang-en flex-1" onclick="setLanguage('en')">🇺🇸 English</button>
            </div>

            <h2 class="text-3xl font-bold mb-3 text-center whitespace-pre-line" data-i18n="onboarding_title"></h2>
            <p class="text-sm text-muted text-center mb-8 max-w-xs" data-i18n="onboarding_subtitle"></p>

            <div class="space-y-5 w-full max-w-sm">
                <div class="flex items-center gap-4">
                    <div class="w-10 h-10 rounded-full accent-light accent-text flex justify-center items-center font-bold flex-shrink-0">1</div>
                    <p class="text-sm" data-i18n="onboarding_step1"></p>
                </div>
                <div class="flex items-center gap-4">
                    <div class="w-10 h-10 rounded-full accent-light accent-text flex justify-center items-center font-bold flex-shrink-0">2</div>
                    <p class="text-sm" data-i18n="onboarding_step2"></p>
                </div>
                <div class="flex items-center gap-4">
                    <div class="w-10 h-10 rounded-full accent-light accent-text flex justify-center items-center font-bold flex-shrink-0">3</div>
                    <p class="text-sm" data-i18n="onboarding_step3"></p>
                </div>
                <div class="flex items-center gap-4">
                    <div class="w-10 h-10 rounded-full accent-light accent-text flex justify-center items-center font-bold flex-shrink-0">4</div>
                    <p class="text-sm" data-i18n="onboarding_step4"></p>
                </div>
            </div>

            <div class="mt-8 mb-4 w-full max-w-sm">
                <label id="agb-label" class="flex items-start gap-3 cursor-pointer select-none">
                    <input type="checkbox" id="agb-checkbox"
                           class="mt-0.5 w-5 h-5 flex-shrink-0 rounded accent-checkbox cursor-pointer"
                           style="accent-color: var(--accent);">
                    <span id="agb-label-text" class="text-sm text-muted leading-snug"></span>
                </label>
                <p id="agb-error" class="mt-2 text-xs text-red-500 hidden" data-i18n="onboarding_agb_error"></p>
            </div>

            <button onclick="finishOnboarding()" class="mt-4 w-full max-w-sm accent-bg accent-bg-hover text-white py-4 rounded-2xl font-bold accent-shadow transition-colors active:scale-95" data-i18n="onboarding_cta"></button>
        </section>

        <!-- ─── View: Scan ─── -->
        <section id="view-scan"  class="view hidden flex flex-col px-5 pt-4 pb-4 min-h-full" style="max-width: 600px; margin: 0 auto; width: 100%;">
            <div id="backup-warning" class="w-full mb-4 bg-amber-500/10 border border-amber-500/30 text-amber-600 dark:text-amber-400 rounded-2xl p-3 text-xs flex justify-between items-center hidden">
                <span><i class="fa-solid fa-triangle-exclamation mr-2"></i><span data-i18n="backup_warning"></span></span>
                <div class="flex items-center gap-2 flex-shrink-0">
                    <button onclick="downloadData()" class="underline font-bold ml-2 whitespace-nowrap" data-i18n="backup_save"></button>
                    <button onclick="dismissBackupWarning()" class="ml-1 text-amber-600 dark:text-amber-400 hover:opacity-70 transition text-base leading-none font-bold" title="Schließen">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>
            </div>

            <div class="mb-4">
                <label class="text-xs font-semibold text-muted uppercase tracking-wider mb-1 block" data-i18n="scan_deck_label"></label>
                <!-- Compact chip-dropdown multiselect -->
                <div id="scan-deck-multiselect" class="relative">
                    <!-- Trigger row -->
                    <button type="button" id="scan-deck-trigger"
                        onclick="toggleScanDeckDropdown()"
                        class="w-full bg-card border border-subtle rounded-xl px-3 py-2.5 text-sm font-medium accent-ring focus:outline-none dark:bg-slate-800 flex items-center justify-between gap-2 text-left">
                        <div id="scan-deck-chips" class="flex flex-wrap gap-1.5 flex-1 min-w-0"></div>
                        <i id="scan-deck-chevron" class="fa-solid fa-chevron-down text-muted flex-shrink-0 transition-transform duration-200 text-xs"></i>
                    </button>
                    <!-- Dropdown panel -->
                    <div id="scan-deck-dropdown"
                        class="hidden absolute left-0 right-0 z-50 mt-1 bg-card border border-subtle rounded-xl shadow-lg overflow-hidden dark:bg-slate-800"
                        style="max-height:11rem;overflow-y:auto;">
                        <div id="scan-deck-options" class="py-1"></div>
                    </div>
                </div>
            </div>

            <input type="file" id="scan-file-input" class="hidden" accept="image/*" capture="environment" onchange="handleImageSelected(event)">
            <input type="file" id="scan-gallery-input" class="hidden" accept="image/*" onchange="handleImageSelected(event)">

            <div class="flex-1 flex flex-col justify-center items-center">
                <div id="scan-preview-area" class="w-full aspect-square max-h-74 rounded-3xl border-2 border-dashed border-subtle flex flex-col items-center justify-center p-6 text-center mb-6 relative overflow-hidden bg-card shadow-sm cursor-pointer active:scale-98 transition-transform" onclick="document.getElementById('scan-file-input').click()">
                    <div id="scan-placeholder" class="flex flex-col items-center">
                        <i class="fa-solid fa-camera text-5xl text-muted mb-4"></i>
                        <p class="text-sm text-muted font-medium" data-i18n="scan_placeholder_main"></p>
                        <p class="text-xs text-muted mt-1 opacity-60" data-i18n="scan_placeholder_sub"></p>
                    </div>
                    <img id="scan-preview-img" src="" alt="Preview" class="hidden absolute inset-0 w-full h-full object-contain rounded-3xl">
                    <div id="scan-loader" class="absolute inset-0 bg-white/90 dark:bg-slate-800/90 flex flex-col items-center justify-center hidden backdrop-blur-sm rounded-3xl">
                        <i class="fa-solid fa-circle-notch fa-spin accent-text text-4xl mb-4"></i>
                        <p class="text-sm font-medium animate-pulse" id="scan-loader-text" data-i18n="scan_loader_analyzing"></p>
                    </div>
                </div>

                <div id="scan-error" class="hidden w-full mb-4 bg-red-500/10 border border-red-400/40 text-red-500 dark:text-red-400 rounded-2xl p-3 text-xs flex items-start gap-2">
                    <i class="fa-solid fa-circle-exclamation mt-0.5 flex-shrink-0"></i>
                    <span id="scan-error-text"></span>
                </div>

                <div class="w-full flex flex-col gap-3">
                    <div class="flex gap-2 w-full">
                        <button onclick="document.getElementById('scan-file-input').click()" class="flex-1 border accent-border accent-text py-3 rounded-2xl font-semibold hover:accent-light transition flex justify-center items-center gap-2 active:scale-95 text-sm">
                            <i class="fa-solid fa-camera"></i> <span data-i18n="scan_camera_btn"></span>
                        </button>
                        <button onclick="document.getElementById('scan-gallery-input').click()" class="flex-1 border accent-border accent-text py-3 rounded-2xl font-semibold hover:accent-light transition flex justify-center items-center gap-2 active:scale-95 text-sm">
                            <i class="fa-solid fa-image"></i> <span data-i18n="scan_gallery_btn"></span>
                        </button>
                    </div>

                    <!-- Cloudflare Turnstile Widget (nur für Free-Tier sichtbar) -->
                    <div id="turnstile-wrapper" class="hidden w-full flex justify-center">

            legal_privacy_heading: 'Datenschutzerklärung',
            legal_privacy_body: `<strong>Verantwortlicher</strong>
Verantwortlicher im Sinne der Datenschutzgesetze, insbesondere der EU-Datenschutz-Grundverordnung (DSGVO), ist Hendrik Junker (Kontaktdaten siehe Impressum).

<strong>Ihre Betroffenenrechte</strong>
Unter den angegebenen Kontaktdaten können Sie gemäß DSGVO jederzeit folgende Rechte ausüben:
<ul>
    • Auskunft über Ihre bei uns gespeicherten Daten (Art. 15 DSGVO)
    • Berichtigung unrichtiger personenbezogener Daten (Art. 16 DSGVO)
    • Löschung Ihrer bei uns gespeicherten Daten (Art. 17 DSGVO)
    • Einschränkung der Datenverarbeitung (Art. 18 DSGVO)
    • Widerspruch gegen die Verarbeitung (Art. 21 DSGVO)
    • Datenübertragbarkeit (Art. 20 DSGVO)
</ul>
Sofern Sie uns eine Einwilligung erteilt haben, können Sie diese jederzeit mit Wirkung für die Zukunft widerrufen. Sie haben zudem das Recht, sich jederzeit mit einer Beschwerde an die zuständige Datenschutzaufsichtsbehörde zu wenden.

<strong>Verarbeitungstätigkeiten und genutzte Dienste</strong>
<strong>Lokale Datenspeicherung (IndexedDB & Local Storage)</strong>
Zur Bereitstellung der Kernfunktionen dieser Web-App greifen wir auf lokale Speichertechnologien Ihres Browsers zurück. Ihre erstellten Karteikarten und Lernfortschritte werden ausschließlich in der IndexedDB Ihres Endgeräts gespeichert. Zusätzlich speichern wir technische Einstellungen (z. B. gewählte Sprache, Theme-Präferenz, PWA-Installationsstatus und Ihren verschlüsselten Lizenzschlüssel) im Local Storage Ihres Browsers. 
Diese Datenspeicherung ist zwingend erforderlich, um den von Ihnen ausdrücklich gewünschten Dienst technisch fehlerfrei zur Verfügung zu stellen. Rechtsgrundlage für den Zugriff auf den lokalen Speicher ist § 25 Abs. 2 Nr. 2 TTDSG. Die Daten verbleiben vollständig auf Ihrem Endgerät und werden nicht auf unsere Server hochgeladen oder mit Dritten geteilt, sofern Sie nicht explizit Cloud-Dienste (wie den Scan-Vorgang) aktivieren.

<strong>Hosting und Logfiles</strong>
Diese Web-App wird bei Vercel gehostet. Beim Aufruf der App erfasst der Server automatisch allgemeine Verbindungsdaten (u.a. IP-Adresse, Datum, Uhrzeit, Browser-Typ), um die Sicherheit, Stabilität und Bereitstellung der App zu gewährleisten. Rechtsgrundlage ist unser berechtigtes Interesse (Art. 6 Abs. 1 lit. f DSGVO). Es wurde ein Vertrag zur Auftragsverarbeitung (AVV) mit dem Hosting-Anbieter geschlossen.

<strong>Nutzung von OpenAI zur Textextraktion</strong>
Wenn Sie die Scan-Funktion nutzen, werden die Bild- oder Text-Rohdaten über eine API-Schnittstelle an die Server von OpenAI (OpenAI Ireland Ltd., Dublin) übertragen. Dies ist zur Bereitstellung der KI-Funktion erforderlich. Rechtsgrundlage hierfür ist unser berechtigtes Interesse (Art. 6 Abs. 1 lit. f DSGVO) sowie die Erfüllung des Nutzungsvertrages (Art. 6 Abs. 1 lit. b DSGVO). Wir haben mit OpenAI einen Auftragsverarbeitungsvertrag (AVV) auf Basis der EU-Standardvertragsklauseln abgeschlossen. Gemäß den offiziellen Richtlinien für die kommerzielle API von OpenAI werden Ihre übermittelten Daten nicht zum Training der OpenAI-Modelle verwendet.

<strong>Kamera- und Fotozugriff sowie Client-Side Filtering</strong>
Um die KI-Scanfunktion nutzen zu können, fordert die App Zugriff auf Ihre Gerätekamera oder Fotogalerie an. Die Erfassung des Kamerabildes und das Zuschneiden des Fotos (Cropping) erfolgen initial rein lokal auf Ihrem Gerät. Zudem führt die App vor einer Übermittlung an externe Schnittstellen eine automatisierte, rein lokale Vorab-Prüfung (Client-Side Filtering) auf unzulässige Inhalte (z. B. NSFW-Material) durch. Diese Prüfung findet ausschließlich auf Ihrem Endgerät statt; es werden hierbei keine Bilddaten an unsere Server übertragen. Erst wenn Sie ausdrücklich den Button „Mit KI scannen“ (oder vergleichbar) betätigen und die lokale Prüfung erfolgreich war, wird das isolierte Bildmaterial an die OpenAI-Schnittstelle übermittelt. Wir speichern diese Bilddaten nicht permanent auf unseren Servern; sie werden nach der Verarbeitung durch die KI und der Rückgabe der Karteikarten-Daten serverseitig verworfen.

<strong>Zahlungsabwicklung und Lizenzen (Lemon Squeezy)</strong>
Für den Verkauf von Lizenzen und die Überprüfung von Scan-Limits nutzen wir den Zahlungsdienstleister Lemon Squeezy (Lemon Squeezy, LLC, USA). Wenn Sie eine Lizenz erwerben oder in der App validieren, werden erforderliche Transaktions- und Nutzungsdaten (z. B. IP-Adresse, E-Mail, Lizenzschlüssel) an Lemon Squeezy übermittelt. Die Verarbeitung erfolgt zur Vertragserfüllung (Art. 6 Abs. 1 lit. b DSGVO). Die Datenübermittlung in die USA wird durch den Angemessenheitsbeschluss der EU-Kommission (EU-US Data Privacy Framework) bzw. durch EU-Standardvertragsklauseln abgesichert.

<strong>Scan-Limit-Verwaltung, API-Sicherheit und Cooldown-Logging (Upstash)</strong>
Zur technischen Verwaltung der Scan-Limits (inkl. kostenloser Test-Scans) sowie zur zwingenden Vermeidung von API-Missbrauch nutzen wir den Datenbankdienst Upstash (Upstash Inc., USA). Hierbei werden pseudonymisierte oder gehashte Nutzungsdaten (wie der kryptografisch gehashte Wert Ihrer IP-Adresse oder Ihres Lizenzschlüssels) verarbeitet. Bei festgestellten Verstößen gegen die Nutzungsbedingungen oder bei der Auslösung von automatisierten Content-Policy-Filtern der KI-Schnittstellen wird dieser pseudonymisierte Hash temporär für automatisierte Zugriffsblockaden (sog. Cooldowns) sowie in einem rotierenden Sicherheitsprotokoll gespeichert. Rechtsgrundlage ist unser überwiegendes berechtigtes Interesse (Art. 6 Abs. 1 lit. f DSGVO) an der Aufrechterhaltung der technischen Systemintegrität und Missbrauchsprävention. Auch hier erfolgt die Absicherung des Datentransfers durch EU-Standardvertragsklauseln.

<strong>Kontaktaufnahme</strong>
Wenn Sie per E-Mail Kontakt mit uns aufnehmen, werden Ihre Angaben zur Bearbeitung der Anfrage und für mögliche Anschlussfragen gespeichert. Rechtsgrundlage hierfür ist Art. 6 Abs. 1 lit. a bzw. b DSGVO.

<strong>Einzelfallbezogenes Widerspruchsrecht</strong>
Sie haben das Recht, jederzeit gegen die Verarbeitung von personenbezogenen Daten Widerspruch einzulegen, sofern diese auf Grundlage von berechtigten Interessen (Art. 6 Abs. 1 lit. f DSGVO) erfolgt. Ihren Widerspruch richten Sie bitte per E-Mail an den Verantwortlichen.`,

        currentLang = lang;
        localStorage.setItem('language', lang);
        document.documentElement.lang = lang;

        document.querySelectorAll('[data-i18n]').forEach(el => {

            const val = t(key);
            if (typeof val === 'string') el.innerHTML = val;
        });

    function _updateLangButtons(lang) {
        ['de', 'en'].forEach(l => {
            const btn = document.getElementById(`lang-btn-${l}`);
            if (!btn) return;
            btn.classList.toggle('lang-selected', l === lang);
            btn.classList.toggle('lang-de', l === 'de' && l !== lang);
            btn.classList.toggle('lang-en', l === 'en' && l !== lang);
        });
        const settDe = document.getElementById('settings-lang-de');
        const settEn = document.getElementById('settings-lang-en');
        if (settDe) settDe.style.opacity = lang === 'de' ? '1' : '0.45';
        if (settEn) settEn.style.opacity = lang === 'en' ? '1' : '0.45';
    }

    function initLanguage() {
        const saved = localStorage.getItem('language');
        if (saved === 'de' || saved === 'en') {
            currentLang = saved;
        } else {
            const browserLang = navigator.language || navigator.userLanguage || '';
            currentLang = browserLang.toLowerCase().startsWith('de') ? 'de' : 'en';
        }
        setLanguage(currentLang);
    }

    // ══════════════════════════════════════════════
    //  IndexedDB Layer
    // ══════════════════════════════════════════════
    const DB_NAME    = 'VocabAI';
    const DB_VERSION = 1;
    const STORE_META         = 'meta';
    const CURRENT_AGB_VERSION = '1.0';
    const STORE_DECKS = 'decks';

    let db = null;

    function openDB() {
        return new Promise((resolve, reject) => {
            const req = indexedDB.open(DB_NAME, DB_VERSION);
            req.onupgradeneeded = e => {
                const d = e.target.result;
                if (!d.objectStoreNames.contains(STORE_META)) d.createObjectStore(STORE_META);
                if (!d.objectStoreNames.contains(STORE_DECKS)) d.createObjectStore(STORE_DECKS, { keyPath: 'id' });
            };
            req.onsuccess = e => { db = e.target.result; resolve(db); };
            req.onerror   = e => reject(e.target.error);
        });
    }

    function dbGet(store, key) {
        return new Promise((resolve, reject) => {
            const tx  = db.transaction(store, 'readonly');
            const req = tx.objectStore(store).get(key);
            req.onsuccess = () => resolve(req.result);
            req.onerror   = e => reject(e.target.error);
        });
    }

    function dbPut(store, value, key) {
        return new Promise((resolve, reject) => {
            const tx  = db.transaction(store, 'readwrite');
            const req = key !== undefined ? tx.objectStore(store).put(value, key) : tx.objectStore(store).put(value);
            req.onsuccess = () => resolve();
            req.onerror   = e => reject(e.target.error);
        });
    }

    function dbDelete(store, key) {
        return new Promise((resolve, reject) => {
            const tx  = db.transaction(store, 'readwrite');
            const req = tx.objectStore(store).delete(key);
            req.onsuccess = () => resolve();
            req.onerror   = e => reject(e.target.error);
        });
    }

    function dbGetAll(store) {
        return new Promise((resolve, reject) => {
            const tx  = db.transaction(store, 'readonly');
            const req = tx.objectStore(store).getAll();
            req.onsuccess = () => resolve(req.result);
            req.onerror   = e => reject(e.target.error);
        });
    }

    async function loadState() {
        const saved = await dbGet(STORE_META, 'appState');
        if (saved) appState = { ...appState, ...saved };
    }

    async function saveState() {
        await dbPut(STORE_META, appState, 'appState');
        updateGoalUI();
        checkBackupStatus();
    }

    async function loadDecks() {
        decks = await dbGetAll(STORE_DECKS);
        decks.sort((a, b) => {
            if (a.id === 'difficult_deck') return 1;
            if (b.id === 'difficult_deck') return -1;
            return a.id - b.id;
        });
        
        // MIGRATION: en/de -> front/back auto konvertieren
        let needsSave = false;
        decks.forEach(deck => {
            deck.words.forEach(w => {
                if (w.en !== undefined) { w.front = w.en; delete w.en; needsSave = true; }
                if (w.de !== undefined) { w.back = w.de; delete w.de; needsSave = true; }
            });
        });

        // MIGRATION: difficultPairs aus appState -> difficult_deck
        const savedState = await dbGet(STORE_META, 'appState');
        if (savedState && savedState.difficultPairs && savedState.difficultPairs.length > 0) {
            let diffDeck = decks.find(d => d.id === 'difficult_deck');
            if (!diffDeck) {
                diffDeck = { id: 'difficult_deck', name: '⚠️ Schwierige Wortpaare', words: [] };
            }
            savedState.difficultPairs.forEach(p => {
                if (!diffDeck.words.some(w => w.id === p.id)) {
                    diffDeck.words.push({ id: p.id, front: p.front, back: p.back });
                }
            });
            await dbPut(STORE_DECKS, diffDeck);
            const idx = decks.findIndex(d => d.id === 'difficult_deck');
            if (idx >= 0) decks[idx] = diffDeck; else decks.push(diffDeck);
            // difficultPairs aus appState entfernen
            delete savedState.difficultPairs;
            await dbPut(STORE_META, savedState, 'appState');
        }

        if (decks.filter(d => d.id !== 'difficult_deck').length === 0) {
            const defName = currentLang === 'de' ? 'Standard-Liste' : 'Default List';
            const def = { id: Date.now(), name: defName, words: [] };
            await dbPut(STORE_DECKS, def);
            decks.unshift(def);
        } else if (needsSave) {
            // Alle konvertierten Listen speichern
            for (const deck of decks) { await dbPut(STORE_DECKS, deck); }
        }
    }

    async function saveDeck(deck) {
        await dbPut(STORE_DECKS, deck);
        const idx = decks.findIndex(d => d.id === deck.id);
        if (idx >= 0) decks[idx] = deck; else decks.push(deck);
    }

    async function deleteDeck(deckId) {
        await dbDelete(STORE_DECKS, deckId);
        decks = decks.filter(d => d.id !== deckId);
    }

    function totalWordCount() { return decks.filter(d => d.id !== 'difficult_deck').reduce((s, d) => s + d.words.length, 0); }

    function importData(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = async function(e) {
            try {
                const data = JSON.parse(e.target.result);
                if (Array.isArray(data) && data.length > 0 && data[0].words !== undefined) {
                    let imported = 0;
                    for (const deck of data) {
                        // Dynamisch auf front/back konvertieren + XSS-Härtung
                        // (siehe sanitizeImportedText) BEVOR irgendetwas in
                        // deck.words landet.
                        deck.words = deck.words.map(w => ({
                            id: w.id || Date.now() + Math.random(),
                            front: sanitizeImportedText(w.front || w.en || ''),
                            back: sanitizeImportedText(w.back || w.de || '')
                        }));
                        deck.name = sanitizeImportedText(deck.name || '');
                        const existing = decks.find(d => d.id === deck.id);
                        if (!existing) { await saveDeck(deck); imported += deck.words.length; }
                    }
                    appState.lastBackupWordCount = totalWordCount();
                    await saveState();
                    alert(t('alert_import_success')(imported));
                } else if (Array.isArray(data) && (data[0]?.en || data[0]?.front)) {
                    // Legacy import Format Fallback
                    const target = decks[0];
                    const existingWords = new Set(target.words.map(w => (w.front).toLowerCase()));
                    const newWords = data
                        .filter(w => (w.front && w.back) || (w.en && w.de))
                        .map(w => ({
                            id: Date.now() + Math.random(),
                            front: sanitizeImportedText(w.front || w.en),
                            back: sanitizeImportedText(w.back || w.de)
                        }))
                        .filter(w => !existingWords.has(w.front.toLowerCase()));
                    target.words = [...newWords, ...target.words];
                    await saveDeck(target);
                    appState.lastBackupWordCount = totalWordCount();
                    await saveState();
                    alert(t('alert_import_legacy')(newWords.length, target.name));
                } else {
                    alert(t('alert_import_unknown'));
                    return;
                }
                const onboarded = await dbGet(STORE_META, 'onboarded');
                if (onboarded) switchView('list'); else finishOnboarding();
            } catch (err) {
                alert(t('alert_import_error'));
            }
        };
        reader.readAsText(file);
        event.target.value = '';
    }

    function populateScanDeckSelector() {
        const optionsEl = document.getElementById('scan-deck-options');

        const filtered = decks.filter(d => d.id !== 'difficult_deck');

        // Gespeicherte IDs laden, validieren (falls Liste gelöscht wurde)

        const validSelectedIds = selectedIds.filter(id => filtered.some(d => d.id === id));
        
        // Fallback auf erste Liste, falls nichts (Gültiges) ausgewählt ist
        if (validSelectedIds.length === 0 && filtered.length > 0) {

    let _scanImageBase64 = null;

    function handleImageSelected(event) {
        const file = event.target.files[0];
        if (!file) return;

        // ── Dateigrößen-Schutz: max. 15 MB ───────────────────────────────────
        // Warum client-seitig und nicht nur im Backend?
        //   FileReader.readAsDataURL() lädt die komplette Datei in den
        //   JS-Heap des Browsers. Ein 50-MB-HEIC vom iPhone erzeugt einen
        //   ~67-MB-Base64-String – das reicht auf Low-End-Android-Geräten
        //   für einen Out-of-Memory-Absturz, bevor das Backend überhaupt
        //   eine Chance hat zu prüfen. Der Check hier verhindert das Laden
        //   der Datei in den Speicher komplett.
        //   Das Backend-Limit (4 MB Body-Limit in Vercel) bleibt als zweite
        //   Verteidigungslinie trotzdem aktiv.
        const MAX_FILE_BYTES = 15 * 1024 * 1024; // 15 MB
        if (file.size > MAX_FILE_BYTES) {
            setScanError(
                currentLang === 'de'
                    ? `Bild zu groß (${(file.size / 1024 / 1024).toFixed(1)} MB). Bitte ein Bild unter 15 MB wählen.`
                    : `Image too large (${(file.size / 1024 / 1024).toFixed(1)} MB). Please choose an image under 15 MB.`
            );
            event.target.value = ''; // Input zurücksetzen damit dieselbe Datei erneut triggerbar bleibt
            return;
        }

        setScanError('');
        const reader = new FileReader();
        reader.onload = function(e) {
            // Zeige Crop-Modal mit Cropper.js
            const cropImg = document.getElementById('crop-image');
            cropImg.src = e.target.result;
            document.getElementById('crop-modal').classList.remove('hidden');
            // Cropper initialisieren (vorherige Instanz zerstören falls vorhanden)
            if (window._cropper) { window._cropper.destroy(); window._cropper = null; }
            cropImg.onload = function() {
                window._cropper = new Cropper(cropImg, {
                    viewMode: 1,
                    autoCropArea: 0.9,
                    movable: true,
                    zoomable: true,
                    rotatable: false,
                    scalable: false,
                });
            };
        };
        reader.readAsDataURL(file);
        event.target.value = '';
    }

    function closeCropModal() {
        document.getElementById('crop-modal').classList.add('hidden');
        if (window._cropper) { window._cropper.destroy(); window._cropper = null; }
    }

    function confirmCrop() {

    function setScanError(msg) {

    // ── Turnstile Callbacks ──
    let _turnstileToken    = null;
    let _scanAttempted     = false; // Flag: wird true wenn Nutzer aktiv auf "Scannen" drückt
    let _turnstileReady    = false; // Flag: Cloudflare-Skript vollständig geladen
    let _turnstileRendered = false; // Flag: Widget bereits gerendert (kein Doppel-Render)

    // ════════════════════════════════════════════════════════════════
    // onTurnstileLoad – wird vom Cloudflare-Skript via ?onload= aufgerufen
    //
    // Race-Condition-Problem (Fehler 400020) ohne onload:
    //   Das Skript lädt async. Falls _showTurnstileIfNeeded() ausgeführt
    //   wird bevor window.turnstile definiert ist, schlägt turnstile.render()
    //   mit "400020: Invalid sitekey" oder einem TypeError fehl.
    //
    // Lösung:
    //   Cloudflare ruft onTurnstileLoad() auf sobald das Skript vollständig
    //   ausgeführt und window.turnstile bereit ist. Erst dann rendern wir.
    //   Das ?onload=onTurnstileLoad Query-Param im Script-Tag aktiviert dies.
    // ════════════════════════════════════════════════════════════════
    function onTurnstileLoad() {
        _turnstileReady = true;
        // Falls _showTurnstileIfNeeded() bereits aufgerufen wurde (View war schon aktiv),
        // jetzt nachholen was damals übersprungen wurde.
        const wrapper = document.getElementById('turnstile-wrapper');
        if (wrapper && !wrapper.classList.contains('hidden') && !_turnstileRendered) {
            _renderTurnstileWidget();
        }
    }

    function onTurnstileSuccess(token) {
        _turnstileToken = token;
        // Scan-Button aktivieren sobald Token vorliegt und Bild gewählt
        const scanBtn = document.getElementById('scan-btn');
        if (scanBtn && window._scanImageBase64) {
            scanBtn.disabled = false;
        }
    }

    function onTurnstileExpired() {
        _turnstileToken = null;
    }

    // ════════════════════════════════════════════════════════════════
    // onTurnstileError – Fehler-Callback des Cloudflare Turnstile Widgets
    //
    // Häufige Ursachen:
    //   - Netzwerkfehler / Cloudflare nicht erreichbar
    //   - Ungültiger Site-Key (Dev-Umgebung)
    //   - Browser blockiert Cloudflare-Ressourcen (z.B. Ad-Blocker)
    //
    // Design-Entscheidungen:
    //   1. Kein console.error() – verhindert Log-Flooding bei wiederkehrenden Fehlern
    //   2. Scan-Button deaktivieren – verhindert Scan ohne funktionierenden Bot-Schutz
    //   3. Benutzerfreundliche Meldung nur anzeigen wenn relevant (nach Scan-Versuch
    //      ODER wenn Widget bereits sichtbar war → Nutzer erwartet Funktion)
    //   4. _scanAttempted-Guard bleibt für den Fall dass der Fehler beim initialen
    //      Widget-Laden in Dev-Umgebungen auftritt (kein False-Positive für den User)
    // ════════════════════════════════════════════════════════════════
    function onTurnstileError(errorCode) {
        _turnstileToken = null;

        // Scan-Button deaktivieren – ohne Token darf kein Scan starten
        const scanBtn = document.getElementById('scan-btn');
        if (scanBtn) {
            scanBtn.disabled = true;
        }

        // Nur loggen auf debug-Level, kein console.error() → kein Log-Flooding
        console.warn(`[Turnstile] Widget-Fehler (Code: ${errorCode || 'unbekannt'})`);

        // Nutzer informieren: nur wenn Scan aktiv versucht wurde ODER Widget bereits
        // sichtbar war (Nutzer sieht das Widget und erwartet dass es funktioniert)
        const wrapper = document.getElementById('turnstile-wrapper');
        const widgetVisible = wrapper && !wrapper.classList.contains('hidden');
        if (_scanAttempted || widgetVisible) {
            setScanError(
                currentLang === 'de'
                    ? 'Sicherheitsprüfung fehlgeschlagen. Bitte Seite neu laden.'
                    : 'Security check failed. Please reload the page.'
            );
        }
    }

    // ── Internes Render-Helper (verhindert Doppel-Rendering) ──────
    function _renderTurnstileWidget() {
        if (_turnstileRendered || !window.turnstile) return;
        // BUGFIX Fehler 600010:
        //   cf-turnstile Klasse → Cloudflare rendert Widget sofort beim Skript-Load,
        //   auch wenn Container noch `hidden` ist → Fehler 600010 ("widget not found
        //   in visible area") → onTurnstileError() feuert sofort.
        //   Fix: cf-turnstile Klasse entfernt. Explizites render() erst nachdem
        //   hidden-Klasse weg ist. Alle Optionen (sitekey, callbacks) programmatisch.
        _turnstileRendered = true;
        try {
            window.turnstile.render('#turnstile-widget', {
                sitekey:            '0x4AAAAAADmDM0vIb4pbgSD9',
                theme:              'auto',
                callback:           onTurnstileSuccess,
                'expired-callback': onTurnstileExpired,
                'error-callback':   onTurnstileError,
            });
        } catch (err) {
            console.warn('[Turnstile] render() fehlgeschlagen:', err);
            _turnstileRendered = false; // Retry beim nächsten Aufruf erlauben
        }
    }

    function _resetTurnstileWidget() {
        _turnstileToken = null;
        if (!window.turnstile || !_turnstileRendered) return;
        try { window.turnstile.reset('#turnstile-widget'); } catch (_) {}
        _turnstileRendered = false; // neues render() beim nächsten show erlauben
    }

    function _showTurnstileIfNeeded() {
        const licenseKey = localStorage.getItem('focus_license_key') || '';
        const wrapper    = document.getElementById('turnstile-wrapper');
        if (!wrapper) return;

        if (!licenseKey) {
            // Free-Tier: Widget anzeigen
            wrapper.classList.remove('hidden');
            // Nur rendern wenn Cloudflare-Skript bereits vollständig geladen ist.
            // Falls nicht: onTurnstileLoad() wird später aufgerufen und holt das nach.
            if (_turnstileReady && !_turnstileRendered) {
                _renderTurnstileWidget();
            }
        } else {
            // Paid-Tier: Widget ausblenden
            wrapper.classList.add('hidden');
            _turnstileToken = null;
        }
    }

    async function startAIScan() {
        if (!_scanImageBase64) { setScanError(t('scan_no_image')); return; }

        _scanAttempted = true; // Ab jetzt darf onTurnstileError eine Meldung zeigen

        // Lizenzschlüssel und Free-Trial-Logik
        const licenseKey = localStorage.getItem('focus_license_key') || '';
        const FREE_TRIAL_LIMIT = 5;
        if (!licenseKey) {
            if ((appState.scanCount || 0) >= FREE_TRIAL_LIMIT) {
                setScanError(t('scan_error_limit_reached'));
                openSettingsModal();
                return;
            }
            // Turnstile-Token prüfen (nur Free-Tier)
            if (!_turnstileToken) {
                setScanError(t('scan_error_turnstile_required'));
                _showTurnstileIfNeeded();
                return;
            }
        }

        const loader     = document.getElementById('scan-loader');
        const loaderText = document.getElementById('scan-loader-text');
        const scanBtn    = document.getElementById('scan-btn');

        setScanError('');
        loader.classList.remove('hidden');
        if (loaderText) loaderText.textContent = t('scan_loader_uploading');
        scanBtn.disabled = true;

        try {
            if (loaderText) loaderText.textContent = t('scan_loader_ai');

            const requestBody = { image: _scanImageBase64 };
            // Turnstile-Token nur für Free-Tier mitsenden
            if (!licenseKey && _turnstileToken) {
                requestBody.turnstileToken = _turnstileToken;
            }

            const response = await fetch('/api/scan', {
                method: 'POST',
                headers: {
                    'Content-Type':  'application/json',
                    'Authorization': `Bearer ${licenseKey || 'FREE_TRIAL'}`
                },
                body: JSON.stringify(requestBody),
            });

            if (!response.ok) {
                let errData = {};
                try { errData = await response.json(); } catch (_) {}

                // HTTP 429 → Scan-Limit erreicht
                if (response.status === 429) {
                    throw new Error('LIMIT_REACHED');
                }

                // HTTP 403 + turnstile → Turnstile-Fehler
                if (response.status === 403 && errData.turnstile) {
                    // Token ist verbraucht/ungültig → zurücksetzen, Widget neu rendern
                    _turnstileToken = null;
                    if (window.turnstile) {
                        _resetTurnstileWidget();
                    }
                    throw new Error(t('scan_error_turnstile_failed'));
                }

                // HTTP 403 → Temporärer Cooldown (z.B. nach Policy-Verstoß)
                if (response.status === 403 && errData.cooldown) {
                    const msg = currentLang === 'de'
                        ? 'Dein Zugang wurde vorübergehend gesperrt. Bitte versuche es in 15 Minuten erneut oder kontaktiere den Support.'
                        : 'Your access has been temporarily suspended. Please try again in 15 minutes or contact support.';
                    throw new Error(msg);
                }

                // HTTP 400 → Bild konnte nicht verarbeitet werden (Content-Policy, kein Ban)
                if (response.status === 400 && errData.cooldown) {
                    const msg = currentLang === 'de'
                        ? 'Dieses Bild konnte nicht verarbeitet werden. Bitte versuche ein anderes Foto (z.B. bessere Beleuchtung oder anderen Bildausschnitt).'
                        : 'This image could not be processed. Please try a different photo.';
                    throw new Error(msg);
                }

                throw new Error(errData.error || `HTTP ${response.status}`);
            }

            const data = await response.json();

            const pairs = data.pairs;
            if (!Array.isArray(pairs) || pairs.length === 0) throw new Error(t('scan_no_vocab'));

            const checked = document.querySelectorAll('.scan-deck-checkbox:checked');
            pendingDeckIds = checked.length > 0
                ? Array.from(checked).map(cb => parseInt(cb.value))
                : (decks.length > 0 ? [decks[0].id] : []);

            pendingScanPairs = pairs.map((p, i) => ({
                id:    Date.now() + i,
                front: (p.front || p.en || '').trim(),
                back:  (p.back  || p.de || '').trim(),
            })).filter(w => w.front && w.back);

            loader.classList.add('hidden');
            _scanImageBase64 = null;
            const previewImg  = document.getElementById('scan-preview-img');
            const placeholder = document.getElementById('scan-placeholder');
            if (previewImg)  { previewImg.src = ''; previewImg.classList.add('hidden'); }
            if (placeholder) { placeholder.classList.remove('hidden'); }
            scanBtn.disabled = true;

            // Token ist Single-Use → nach erfolgreichem Scan zurücksetzen
            _turnstileToken  = null;
            _scanAttempted   = false;
            if (window.turnstile) {
                _resetTurnstileWidget();
            }

            // Scan-Zähler: bevorzugt echten Stand vom Backend übernehmen
            if (data.usage && data.usage.current) {
                appState.scanCount = data.usage.current;
            } else {
                appState.scanCount = (appState.scanCount || 0) + 1;
            }
            await saveState();
            renderScanPreview();
            document.getElementById('scan-preview-modal').classList.remove('hidden');

        } catch (err) {
            console.error('AI scan error:', err);
            loader.classList.add('hidden');
            scanBtn.disabled = false;
            _scanAttempted = false;
            if (err.message === 'LIMIT_REACHED') {
                setScanError(t('scan_error_limit_reached'));
                openSettingsModal();
            } else {
                setScanError(err.message || t('scan_no_vocab'));
            }
        }
    }


    // ── Vorschau Modal Funktionen ──
    function renderScanPreview() {

                    </div>

                    <div class="flex items-center justify-center border-r border-subtle px-1 py-2">

    function swapScanPreview() {
        pendingScanPairs.forEach(p => {
            const temp = p.front;
            p.front = p.back;
            p.back = temp;
        });
        renderScanPreview();
    }

    function closeScanPreview() {
        document.getElementById('scan-preview-modal').classList.add('hidden');
        const badge = document.getElementById('scan-preview-count-badge');
        if (badge) badge.classList.add('hidden');
        pendingScanPairs = [];
        pendingDeckIds = [];
    }

    function showSaveToast(count) {
        const toast = document.getElementById('save-toast');
        const text  = document.getElementById('save-toast-text');
        if (!toast || !text) return;
        text.textContent = t('toast_word_pairs_saved')(count);
        toast.style.opacity = '1';
        toast.style.transform = 'translateX(-50%) translateY(0)';
        clearTimeout(toast._hideTimer);
        toast._hideTimer = setTimeout(() => {
            toast.style.opacity = '0';
            toast.style.transform = 'translateX(-50%) translateY(8px)';
        }, 2500);
    }

    async function confirmScanPreview() {
        const savedCount = pendingScanPairs.length;
        let lastDeckId = null;

        const targetIds = pendingDeckIds.length > 0 ? pendingDeckIds : (decks.length > 0 ? [decks[0].id] : []);

        for (const deckId of targetIds) {
            let deck = decks.find(d => d.id === deckId);
            if (!deck) {
                deck = { id: Date.now(), name: currentLang === 'de' ? 'Neue Liste' : 'New List', words: [] };
            }
            deck.words = [...deck.words, ...pendingScanPairs.map(p => ({ ...p, id: Date.now() + Math.random() }))];
            await saveDeck(deck);
            lastDeckId = deck.id;
        }

        await saveState();
        closeScanPreview();
        showSaveToast(savedCount);
        if (lastDeckId) {
            currentDetailDeckId = lastDeckId;
            switchView('deck-detail');
        }
    }

    async function addManualVocab() {
        const deck = decks.find(d => d.id === currentDetailDeckId);
        if (!deck) return;
        const front = prompt(t('prompt_vocab_front'));
        if (!front) return;
        const back = prompt(t('prompt_vocab_back'));

    async function editVocab(idx) {
        const deck = decks.find(d => d.id === currentDetailDeckId);
        if (!deck) return;
        const w = deck.words[idx];
        const front = prompt(t('prompt_vocab_front_edit'), w.front);
        if (front === null) return;
        const back = prompt(t('prompt_vocab_back_edit'), w.back);
        if (back === null) return;
        deck.words[idx] = { ...w, front: front.trim(), back: back.trim() };
        await saveDeck(deck);

        const deck = decks.find(d => d.id === currentDetailDeckId);
        if (!deck) return;
        if (!confirm(t('confirm_delete_vocab'))) return;
        deck.words.splice(idx, 1);
